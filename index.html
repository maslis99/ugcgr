        const LucideIcon = ({ name, size = 24, className = "", color = "currentColor", strokeWidth = 2, fill = "none" }) => {
            const iconRef = useRef(null);

            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = '';
                    const svgMarkup = window.lucide.icons[name];
                    if (svgMarkup) {
                        const svgElem = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                        svgElem.setAttribute("width", size);
                        svgElem.setAttribute("height", size);
                        svgElem.setAttribute("viewBox", "0 0 24 24");
                        svgElem.setAttribute("fill", fill);
                        svgElem.setAttribute("stroke", color);
                        svgElem.setAttribute("stroke-width", strokeWidth);
                        svgElem.setAttribute("stroke-linecap", "round");
                        svgElem.setAttribute("stroke-linejoin", "round");
                        svgElem.setAttribute("class", `lucide lucide-${name} ${className}`);
                        
                        svgElem.innerHTML = svgMarkup[1].map(tag => {
                            const [tagName, attrs] = tag;
                            const attrStr = Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(' ');
                            return `<${tagName} ${attrStr}></${tagName}>`;
                        }).join('');
                        
                        iconRef.current.appendChild(svgElem);
                    }
                }
            }, [name, size, className, color, strokeWidth, fill]);

            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        const downloadHighResImage = (imageUrl, filename, targetRatioStr = '9:16') => {
          const img = new Image();
          img.crossOrigin = "anonymous"; 
          img.src = imageUrl;
          
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            let targetW, targetH;
            switch(targetRatioStr) {
                case '1:1': targetW = 1080; targetH = 1080; break;
                case '4:5': targetW = 1080; targetH = 1350; break;
                case '16:9': targetW = 1920; targetH = 1080; break;
                case '9:16': default: targetW = 1080; targetH = 1920; break;
            }

            canvas.width = targetW;
            canvas.height = targetH;
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            const scale = Math.max(canvas.width / img.naturalWidth, canvas.height / img.naturalHeight);
            const w = img.naturalWidth * scale;
            const h = img.naturalHeight * scale;
            const x = (canvas.width - w) / 2;
            const y = (canvas.height - h) / 2;

            ctx.drawImage(img, x, y, w, h);
            
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png', 1.0); 
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          };
        };

        const secureCopy = (text, onSuccess) => {
          if (!text) return;
          try {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            textArea.style.top = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            const successful = document.execCommand('copy');
            document.body.removeChild(textArea);
            if (successful && onSuccess) onSuccess();
          } catch (err) { console.error('Copy failed', err); }
        };

        const compressImage = (file, maxWidth = 1024, quality = 0.8) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > height) { if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; } } 
                    else { if (height > maxWidth) { width *= maxWidth / height; height = maxWidth; } }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = (error) => reject(error);
            };
            reader.onerror = (error) => reject(error);
        });

        const fileToBase64 = async (file) => {
            if (!file) return null;
            if (file.type.match(/image.*/)) { try { return await compressImage(file); } catch (e) { console.error(e); } }
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = (error) => reject(error);
            });
        };

        const urlToBase64 = async (url) => {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.readAsDataURL(blob);
                });
            } catch { return null; }
        };

        const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        const base64ToArrayBuffer = (base64) => {
            const binaryString = window.atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);
            return bytes.buffer;
        };

        const pcmToWav = (pcmData, sampleRate = 24000) => {
            const pcm16 = new Int16Array(pcmData);
            const buffer = new ArrayBuffer(44 + pcm16.length * 2);
            const view = new DataView(buffer);
            const writeString = (offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); };
            writeString(0, 'RIFF'); view.setUint32(4, 36 + pcm16.length * 2, true); writeString(8, 'WAVE'); writeString(12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeString(36, 'data');
            view.setUint32(40, pcm16.length * 2, true);
            for (let i = 0; i < pcm16.length; i++) view.setInt16(44 + i * 2, pcm16[i], true);
            return new Blob([view], { type: 'audio/wav' });
        };

        const callApi = async (payload, isText = false) => {
            const targetModel = isText ? "gemini-2.5-flash-preview-09-2025" : "gemini-2.5-flash-image-preview";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent?key=${apiKey}`;
            
            for(let attempt = 0; attempt < 3; attempt++) {
                try {
                    const res = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                    if (!res.ok) {
                        if (res.status === 429 || res.status >= 500) {
                            await wait(500 * (attempt + 1));
                            continue; 
                        }
                        throw new Error(`API Error: ${res.status}`);
                    }
                    const data = await res.json();
                    if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
                         await wait(500);
                         continue;
                    }
                    if(isText) return data.candidates[0].content.parts[0].text;
                    const imgData = data.candidates[0].content.parts.find(p => p.inlineData);
                    if (imgData) return `data:image/png;base64,${imgData.inlineData.data}`;
                } catch(e) {
                    if (attempt === 2) return null;
                    await wait(500);
                }
            }
            return null;
        };

                    jsonStr = jsonStr.replace(/^```json/, '').replace(/```$/, '');
                } else if (jsonStr.startsWith('```')) {
                    jsonStr = jsonStr.replace(/^```/, '').replace(/```$/, '');
                }
                
                try {
                    const parsedData = JSON.parse(jsonStr);
                    setMotionData(parsedData);
                    setMotionText(motionLang === 'ID' ? parsedData.text_id : parsedData.text_en);
                } catch (parseError) {
                    setMotionText(textResponse);
                    setMotionData({ text_id: textResponse, text_en: "Error", structured_json: { error: "Failed to parse" }});
                }
            } catch(e) { setMotionText("Gagal koneksi ke AI."); }
            setIsMotionLoading(false);
          };

          const handleCopyText = () => {
              secureCopy(motionText, () => {
                  setCopyStatus("Tersalin! ✅");
                  setTimeout(() => setCopyStatus("Salin Teks"), 2000);
              });
          };

          const handleCopyJson = () => {
              if (motionData && motionData.structured_json) {
                  const jsonString = JSON.stringify(motionData.structured_json, null, 2);
                  secureCopy(jsonString, () => {
                      setCopyStatusJson("JSON Tersalin! ✅");
                      setTimeout(() => setCopyStatusJson("Salin JSON"), 2000);
                  });
              }
          };

          return (
            <div className="shrink-0 bg-slate-950 rounded-lg border border-slate-800 overflow-hidden group relative flex flex-col shadow-lg shadow-yellow-500/20" 
                 style={{ width: selectedRatio === '16:9' ? '460px' : selectedRatio === '1:1' ? '340px' : '280px' }}>
                
                <div className="relative bg-slate-900 w-full" style={getAspectRatioStyle()}>
                     {!loading && image && (
                       <button onClick={(e) => { e.stopPropagation(); onRegenerate(); }}
                         className="absolute top-2 right-2 w-8 h-8 bg-black/50 hover:bg-black/80 backdrop-blur-sm border border-white/20 rounded-full flex items-center justify-center text-white transition-all z-50 shadow-sm cursor-pointer"
                         title="Regenerate This Image"
                       >
                         <Icons.RefreshCw size={14} />
                       </button>
                     )}

                    {loading ? (
                        <div className="absolute inset-0 flex flex-col items-center justify-center text-slate-500 gap-2">
                            <Icons.RefreshCw className="animate-spin" size={24}/>
                            <span className="text-xs font-mono animate-pulse">GENERATING...</span>
                        </div>
                    ) : image ? (
                        <>
                            <img src={image} className="w-full h-full object-cover" onClick={() => onViewImage(image)}/>
                            <div className="absolute top-2 left-2 bg-black/60 backdrop-blur px-2 py-0.5 rounded text-[10px] font-bold text-yellow-400 uppercase border border-white/10">{item.category}</div>
                            <div className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-end p-3 gap-2">
                                <div className="flex gap-2">
                                    <button onClick={() => downloadHighResImage(image, `result-${item.id}.png`, selectedRatio)} className="flex-1 bg-white text-black text-[10px] font-bold py-2 rounded hover:bg-slate-200">DOWNLOAD HD</button>
                                    <button onClick={() => onViewImage(image)} className="p-2 bg-slate-700 text-white rounded"><Icons.Maximize2 size={14}/></button>
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <button onClick={() => {setShowEdit(!showEdit); setShowMotion(false);}} className={`text-white text-[10px] py-2 rounded font-medium ${showEdit ? 'bg-yellow-600' : 'bg-slate-700 hover:bg-slate-600'}`}>EDIT</button>
                                    <button onClick={() => {setShowMotion(!showMotion); setShowEdit(false); if(!motionData) handleMotion(true);}} className={`text-white text-[10px] py-2 rounded font-medium ${showMotion ? 'bg-purple-600' : 'bg-slate-700 hover:bg-slate-600'}`}>MOTION</button>
                                </div>
                            </div>
                        </>
                    ) : (
                        <div className="absolute inset-0 flex flex-col items-center justify-center text-red-500 gap-2 bg-slate-950 border-2 border-red-900/30 border-dashed rounded-lg">
                            <Icons.AlertCircle size={24}/>
                            <span className="text-xs font-bold">GAGAL GENERATE</span>
                            <button onClick={onRegenerate} className="text-[10px] bg-red-900/50 hover:bg-red-900 text-red-200 px-3 py-1 rounded border border-red-800 transition-colors z-50 relative">Coba Lagi</button>
                        </div>
                    )}
                </div>
                
                {(showEdit || showMotion) && !loading && image && (
                    <div className="p-3 bg-slate-900 border-t border-slate-800 w-full animate-in">
                        <div className="flex justify-between mb-2 items-center">
                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">{showEdit ? "Magic Edit" : "Video Prompt"}</span>
                            <button onClick={() => {setShowEdit(false); setShowMotion(false);}}><Icons.X size={12} className="text-slate-500 hover:text-white"/></button>
                        </div>
                        
                        {showEdit && (
                            <div className="flex gap-2">
                                <input value={editPrompt} onChange={e=>setEditPrompt(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded px-2 py-2 text-[10px] text-white focus:border-yellow-500 outline-none" placeholder="Contoh: Ubah background..."/>
                                <button onClick={handleRegenerate} className="bg-yellow-600 p-2 rounded text-white hover:bg-yellow-500"><Icons.Send size={12}/></button>
                            </div>
                        )}
                        
                        {showMotion && (
                            <div className="space-y-3">
                                 <div className="flex justify-end gap-1 mb-1">
                                     <button onClick={() => setMotionLang('ID')} className={`text-[9px] px-2 py-0.5 rounded border ${motionLang === 'ID' ? 'bg-yellow-600 border-yellow-600 text-white' : 'bg-transparent border-slate-700 text-slate-500'}`}>IND</button>
                                     <button onClick={() => setMotionLang('EN')} className={`text-[9px] px-2 py-0.5 rounded border ${motionLang === 'EN' ? 'bg-yellow-600 border-yellow-600 text-white' : 'bg-transparent border-slate-700 text-slate-500'}`}>ENG</button>
                                 </div>
                                 <div className="space-y-2">
                                     <select className="w-full bg-slate-950 border border-slate-700 text-[10px] text-white rounded px-2 py-1 outline-none" value={selectedCamMove} onChange={e=>setSelectedCamMove(e.target.value)}>
                                         {MOTION_PRESETS.camera.map(m => <option key={m} value={m}>{m}</option>)}
                                     </select>
                                     <select className="w-full bg-slate-950 border border-slate-700 text-[10px] text-white rounded px-2 py-1 outline-none" value={selectedModelMove} onChange={e=>setSelectedModelMove(e.target.value)}>
                                         {MOTION_PRESETS.model.map(m => <option key={m} value={m}>{m}</option>)}
                                     </select>
                                     <select className="w-full bg-slate-950 border border-slate-700 text-[10px] text-white rounded px-2 py-1 outline-none" value={selectedTalkingStyle} onChange={e=>setSelectedTalkingStyle(e.target.value)}>
                                         {TALKING_STYLES.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                     </select>
                                 </div>
                                 <button onClick={() => handleMotion(true)} disabled={isMotionLoading} className="w-full bg-purple-600 hover:bg-purple-500 text-white text-[10px] py-1.5 rounded flex items-center justify-center gap-2 font-bold">
                                    {isMotionLoading ? <Icons.RefreshCw size={10} className="animate-spin"/> : <Icons.RefreshCw size={10}/>}
                                    {isMotionLoading ? "Menganalisis..." : "Buat Ulang Prompt"}
                                 </button>
                                 <div className="bg-black/30 p-2 rounded border border-slate-800">
                                     <div className="text-[9px] text-slate-300 h-20 overflow-y-auto custom-scrollbar mb-2 leading-relaxed whitespace-pre-wrap">
                                         {motionText || "Klik tombol untuk membuat prompt..."}
                                     </div>
                                     {motionText && (
                                        <div className="grid grid-cols-2 gap-2 mt-2">
                                            <button onClick={handleCopyText} className="bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] py-1.5 rounded border border-slate-700 flex items-center justify-center gap-1">
                                                <Icons.Copy size={10}/> {copyStatus}
                                            </button>
                                            <button onClick={handleCopyJson} className="bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] py-1.5 rounded border border-slate-700 flex items-center justify-center gap-1">
                                                <Icons.FileJson size={10}/> {copyStatusJson}
                                            </button>
                                        </div>
                                     )}
                                 </div>
                            </div>
                        )}
                    </div>
                )}
            </div>
          );
        };

        const App = () => {
          const [loading, setLoading] = useState(false);
          const [resultsReady, setResultsReady] = useState(false);
          const [isStudioOpen, setIsStudioOpen] = useState(false); 
          const [isGeneratingDesc, setIsGeneratingDesc] = useState(false);
          const [alertMessage, setAlertMessage] = useState(null);
          
          const [mainPhoto, setMainPhoto] = useState(null); 
          const [mainPhotoFile, setMainPhotoFile] = useState(null);
          const [additionalPhotos, setAdditionalPhotos] = useState([]); 
          const [productInfo, setProductInfo] = useState('');
          
          const [models, setModels] = useState([]);
          const [aiModelConfig, setAiModelConfig] = useState({ gender: 'auto', age: 'Remaja', hijab: false });
          const [ratio, setRatio] = useState('9:16'); 
          
          const [generatedImages, setGeneratedImages] = useState({ ugc: [] });
          const [viewImageUrl, setViewImageUrl] = useState(null);
          const [showRecModal, setShowRecModal] = useState(false);

          const [voState, setVoState] = useState({ script: "", audioUrl: null, loadingScript: false, loadingAudio: false, isPlaying: false, category: 'ugc', voice: 'Zephyr', accent: 'none' });
          const audioRef = useRef(null);

          const allPrompts = {
            ugc: [
              "UGC. Medium Shot (Waist Up). Front View. Clear focus on subject.",
              "UGC. Medium Shot. Slightly Angled View (3/4). Natural look.",
              "UGC. Knee-Up Shot. Front View. Full outfit visible."
            ]
          };

          const showAlert = (msg) => setAlertMessage(msg);

          const handlePhotoUpload = (e, type) => {
            const file = e.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            if (type === 'main') { setMainPhoto(url); setMainPhotoFile(file); }
            else if (type === 'model') { if (models.length < 2) setModels([...models, {id: Date.now(), url, file, styleDesc: ''}]); }
            e.target.value = null;
          };

          const updateModelDesc = (id, text) => setModels(prev => prev.map(m => m.id === id ? { ...m, styleDesc: text } : m));
          const handleRemoveAdditional = (id) => setAdditionalPhotos(prev => prev.filter(p => p.id !== id));

          const handleApplyRecommendation = async () => {
            if (!mainPhotoFile) return showAlert("Upload foto produk dulu!");
            setIsGeneratingDesc(true);
            try {
                const b64 = await fileToBase64(mainPhotoFile);
                const prompt = "Analisis gambar ini. Identifikasi produk. Buat 1 kalimat deskripsi menarik & konsep foto estetik. Bahasa Indonesia.";
                const payload = { contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: 'image/png', data: b64.split(',')[1] } }] }] };
                const text = await callApi(payload, true);
                setProductInfo(text.trim());
                setShowRecModal(false); 
            } catch (e) { showAlert("Gagal."); } finally { setIsGeneratingDesc(false); }
          };

          const handleSingleRegenerate = async (category, index) => {
              setGeneratedImages(prev => {
                  const catItems = [...prev[category]];
                  catItems[index] = { ...catItems[index], loading: true };
                  return { ...prev, [category]: catItems };
              });
              try {
                  const base64Main = await fileToBase64(mainPhotoFile);
                  const modelImagesData = [];
                  for(let m of models) { const b64 = await fileToBase64(m.file); modelImagesData.push({ data: b64 }); }
                  const supportingImagesData = [];
                  for(let p of additionalPhotos) { if (p.file) { const b64 = await fileToBase64(p.file); supportingImagesData.push({ data: b64 }); } }

                  const promptBase = allPrompts[category][index];
                  const ratioMap = { '9:16': 'Vertical 9:16', '4:5': 'Vertical Feed 4:5', '1:1': 'Square 1:1', '16:9': 'Landscape 16:9' };
                  let fullPrompt = `(ASPECT RATIO: ${ratioMap[ratio] || '9:16'}). Produk: ${productInfo}. ${promptBase}`;

                  if (models.length > 0) fullPrompt += " FACE SWAP: Use uploaded references.";
                  else fullPrompt += ` MODEL AI: ${aiModelConfig.gender}, ${aiModelConfig.age}.`;

                  const url = await generateImageToImageAPI(fullPrompt, base64Main, [...modelImagesData, ...supportingImagesData]);
                  setGeneratedImages(prev => {
                      const catItems = [...prev[category]];
                      catItems[index] = { ...catItems[index], url: url, loading: false, id: Date.now() }; 
                      return { ...prev, [category]: catItems };
                  });
              } catch(e) {
                  setGeneratedImages(prev => {
                      const catItems = [...prev[category]];
                      catItems[index] = { ...catItems[index], loading: false };
                      return { ...prev, [category]: catItems };
                  });
              }
          };

          const runGenerationProcess = async () => {
            setLoading(true); setResultsReady(true);
            const init = (cat) => Array(3).fill(0).map((_,i) => ({ id: Math.random(), url: '', category: cat, loading: true }));
            setGeneratedImages({ ugc: init('ugc') });
            try {
                const base64Main = await fileToBase64(mainPhotoFile);
                const modelImagesData = [];
                for(let m of models) { const b64 = await fileToBase64(m.file); modelImagesData.push({ data: b64 }); }
                const supportingImagesData = [];
                for(let p of additionalPhotos) { if (p.file) { const b64 = await fileToBase64(p.file); supportingImagesData.push({ data: b64 }); } }
                
                const promptList = allPrompts.ugc;
                const promises = promptList.map(async (pBase, idx) => {
                    await wait(idx * 200); 
                    const ratioMap = { '9:16': 'Vertical 9:16', '4:5': 'Vertical Feed 4:5', '1:1': 'Square 1:1', '16:9': 'Landscape 16:9' };
                    let fullPrompt = `(ASPECT RATIO: ${ratioMap[ratio] || '9:16'}). Produk: ${productInfo}. ${pBase}`;
                    const url = await generateImageToImageAPI(fullPrompt, base64Main, [...modelImagesData, ...supportingImagesData]);
                    setGeneratedImages(prev => {
                        const list = [...prev.ugc]; list[idx] = { ...list[idx], url: url, loading: false }; 
                        return { ...prev, ugc: list };
                    });
                });
                await Promise.all(promises);
            } catch(e) { console.error(e); }
            setLoading(false);
          };
          
          const handleGenerateButton = () => {
            if (!mainPhotoFile) return showAlert("Upload foto produk utama dulu ya!");
            if (!productInfo.trim()) { setShowRecModal(true); return; }
            runGenerationProcess();
          };

          const handleGenerateAudio = async () => {
              if(!voState.script) return showAlert("Tulis naskah dulu!");
              setVoState(prev => ({ ...prev, loadingAudio: true, audioUrl: null })); 
              try {
                  const payload = { contents: [{ parts: [{ text: voState.script }] }], generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voState.voice } } } }, model: "gemini-2.5-flash-preview-tts" };
                  const { audioData, sampleRate } = await callTtsApi(payload);
                  const blob = pcmToWav(base64ToArrayBuffer(audioData), sampleRate);
                  setVoState(prev => ({ ...prev, audioUrl: URL.createObjectURL(blob), loadingAudio: false }));
              } catch (e) { showAlert("Gagal."); setVoState(prev => ({ ...prev, loadingAudio: false })); }
          };

          const toggleAudio = () => {
              if(!voState.audioUrl) return;
              if(!audioRef.current) audioRef.current = new Audio(voState.audioUrl);
              if(voState.isPlaying) { audioRef.current.pause(); setVoState(p=>({...p, isPlaying:false})); }
              else { audioRef.current.play(); setVoState(p=>({...p, isPlaying:true})); audioRef.current.onended = () => setVoState(p=>({...p, isPlaying:false})); }
          };

          return (
            <div className="min-h-screen pb-20 selection:bg-yellow-500/30">
              {alertMessage && (
                <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-slate-900 border border-yellow-500 w-full max-sm rounded-xl p-6 shadow-2xl text-center animate-in">
                        <Icons.AlertCircle size={48} className="text-red-500 mx-auto mb-4" />
                        <h3 className="text-lg font-bold text-white mb-6">{alertMessage}</h3>
                        <button onClick={() => setAlertMessage(null)} className="bg-yellow-600 hover:bg-yellow-500 text-white py-2 px-8 rounded-full font-bold w-full">Tutup</button>
                    </div>
                </div>
              )}

              <nav className="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-lg h-16 flex items-center">
                  <div className="max-w-7xl mx-auto px-4 flex items-center gap-3 w-full">
                      <div className="bg-yellow-600 p-2 rounded-lg text-white"><Icons.Zap size={20} fill="currentColor"/></div>
                      <div>
                          <h1 className="text-white font-bold text-lg tracking-tight">GENERATOR UGC <span className="text-yellow-500">GS</span></h1>
                          <p className="text-[10px] text-slate-500 font-medium">Tools Sulap AFFILIATE</p>
                      </div>
                  </div>
              </nav>

              <main className="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-12 gap-8">
                <div className="md:col-span-5 space-y-2">
                    <StepPanel number="1" title="Upload Produk" icon={Icons.Upload}>
                        <div className="relative aspect-square bg-slate-950 rounded-lg border-2 border-dashed border-slate-800 hover:border-yellow-500/50 transition-all flex flex-col items-center justify-center group cursor-pointer overflow-hidden">
                            {mainPhoto ? (
                                <React.Fragment>
                                    <img src={mainPhoto} className="w-full h-full object-contain p-4"/>
                                    <button onClick={(e)=>{e.stopPropagation(); setMainPhoto(null);}} className="absolute top-2 right-2 bg-red-500/80 p-1.5 rounded text-white z-20"><Icons.X size={14}/></button>
                                </React.Fragment>
                            ) : (
                                <React.Fragment>
                                    <Icons.Upload size={32} className="text-slate-600 mb-2 group-hover:text-yellow-500"/>
                                    <p className="text-xs text-slate-500 font-medium">Klik Upload Foto Utama</p>
                                </React.Fragment>
                            )}
                            <input type="file" accept="image/*" className="absolute inset-0 opacity-0 cursor-pointer" onChange={e => handlePhotoUpload(e, 'main')}/>
                        </div>
                        <div className="space-y-2">
                            <p className="text-[10px] font-bold text-slate-500 uppercase">Foto Pendukung (Opsional)</p>
                            {additionalPhotos.map(p => (
                                <div key={p.id} className="flex gap-2 items-center bg-slate-950 p-2 rounded border border-slate-800">
                                    <img src={p.url} className="w-8 h-8 rounded object-cover"/>
                                    <input placeholder="Keterangan..." className="flex-1 bg-transparent text-xs outline-none text-white" onChange={e => setAdditionalPhotos(prev => prev.map(ap => ap.id === p.id ? {...ap, desc: e.target.value} : ap))}/>
                                    <button onClick={() => handleRemoveAdditional(p.id)} className="text-slate-500 hover:text-red-400"><Icons.Trash2 size={14}/></button>
                                </div>
                            ))}
                            {additionalPhotos.length < 2 && (
                                <label className="flex items-center justify-center gap-2 py-2 border border-slate-800 rounded text-xs text-slate-500 hover:bg-slate-800 cursor-pointer"><Icons.Plus size={12}/> Tambah Foto Lain<input type="file" className="hidden" onChange={e => { if(e.target.files[0]) setAdditionalPhotos([...additionalPhotos, {id: Date.now(), url: URL.createObjectURL(e.target.files[0]), file: e.target.files[0], desc: ''}]); }}/></label>
                            )}
                        </div>
                    </StepPanel>
                    <StepPanel number="2" title="Jelaskan Produk" icon={Icons.FileText}>
                        <div className="flex justify-end mb-2">
                            <button onClick={handleApplyRecommendation} className="text-[10px] text-yellow-400 flex items-center gap-1">{isGeneratingDesc ? <Icons.RefreshCw size={10} className="animate-spin"/> : <Icons.Sparkles size={10}/>} Auto-Generate</button>
                        </div>
                        <textarea value={productInfo} onChange={e => setProductInfo(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-white focus:border-yellow-500 outline-none h-24 resize-none" placeholder="Jelaskan produkmu..."/>
                        <div className="mt-3">
                            <label className="text-[10px] font-bold text-slate-500 uppercase mb-1 block">Rasio Gambar</label>
                            <select value={ratio} onChange={e=>setRatio(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-xs text-white outline-none">
                                <option value="9:16">9:16 (Story/Tiktok)</option><option value="4:5">4:5 (Feed Portrait)</option><option value="1:1">1:1 (Feed/Square)</option><option value="16:9">16:9 (Landscape/Youtube)</option>
                            </select>
                        </div>
                    </StepPanel>
                    <StepPanel number="3" title="Model AI" icon={Icons.User}>
                        {models.length < 2 && (
                            <label className="group block w-full text-center py-4 border-2 border-dashed border-slate-700 rounded-xl text-xs text-slate-400 cursor-pointer hover:border-yellow-500 transition-all mb-4">
                                <div className="flex flex-col items-center gap-1 font-bold"><Icons.Plus size={16}/><span>UPLOAD WAJAH MODEL</span></div>
                                <input type="file" className="hidden" onChange={e => handlePhotoUpload(e, 'model')}/>
                            </label>
                        )}
                        {models.length > 0 ? (
                            <div className="animate-in">
                                <div className="grid grid-cols-2 gap-2 mb-4">
                                    {models.map(m => (<div key={m.id} className="relative aspect-square bg-slate-950 rounded border border-slate-800"><img src={m.url} className="w-full h-full object-cover"/><button onClick={() => setModels(models.filter(x => x.id !== m.id))} className="absolute top-1 right-1 bg-black/60 p-1 rounded-full"><Icons.X size={10}/></button></div>))}
                                </div>
                                {models.map((m, i) => (<textarea key={m.id} value={m.styleDesc || ''} onChange={(e) => updateModelDesc(m.id, e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs text-white mb-2 h-16" placeholder={`Pakaian Model ${i+1}...`}/>))}
                            </div>
                        ) : (
                            <div className="bg-slate-950 p-4 rounded-lg border border-slate-800 animate-in">
                                <div className="grid grid-cols-2 gap-4 mb-4">
                                    <div><label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Gender</label><select className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-white" value={aiModelConfig.gender} onChange={e=>setAiModelConfig({...aiModelConfig, gender: e.target.value})}><option value="auto">Otomatis</option><option value="female">Wanita</option><option value="male">Pria</option></select></div>
                                    <div><label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Usia</label><select className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-white" value={aiModelConfig.age} onChange={e=>setAiModelConfig({...aiModelConfig, age: e.target.value})}><option>Anak-anak</option><option>Remaja</option><option>Dewasa</option><option>Orang Tua</option></select></div>
                                </div>
                                <label className="flex items-center gap-3 cursor-pointer p-3 bg-slate-900 rounded-lg border border-slate-700"><input type="checkbox" checked={aiModelConfig.hijab} onChange={e=>setAiModelConfig({...aiModelConfig, hijab: e.target.checked})} className="hidden"/><div className={`w-4 h-4 rounded border flex items-center justify-center ${aiModelConfig.hijab ? 'bg-yellow-600' : 'border-slate-500'}`}>{aiModelConfig.hijab && <Icons.Check size={10} className="text-white"/>}</div><span className="text-xs text-slate-300">Hijab?</span></label>
                            </div>
                        )}
                    </StepPanel>
                    <button onClick={handleGenerateButton} disabled={loading} className={`w-full py-4 rounded-xl font-bold text-sm uppercase tracking-widest flex items-center justify-center gap-2 ${loading ? 'bg-slate-800 text-slate-500' : 'bg-yellow-600 text-white hover:bg-yellow-500'}`}>
                        {loading ? <Icons.RefreshCw className="animate-spin" size={16}/> : <Icons.Sparkles size={16}/>}
                        {loading ? "PROSES..." : "GENERATE ASET"}
                    </button>
                </div>
                <div className="md:col-span-7 space-y-8">
                    <div className="space-y-3">
                        <div className="flex items-center gap-2 border-b border-slate-800 pb-2"><Icons.User size={16} className="text-green-500"/><h2 className="text-sm font-bold text-white uppercase">UGC Photos</h2></div>
                        <div className="flex gap-4 overflow-x-auto pb-4 custom-scrollbar">
                            {resultsReady ? generatedImages.ugc.map((item, idx) => (
                                <ResultCard key={item.id} item={item} onViewImage={setViewImageUrl} productInfo={productInfo} selectedRatio={ratio} onRegenerate={() => handleSingleRegenerate('ugc', idx)} />
                            )) : (
                                Array(3).fill(0).map((_, i) => (
                                    <div key={i} className="shrink-0 bg-slate-900/50 rounded-lg border border-dashed border-slate-800 flex items-center justify-center" style={{ width: ratio === '16:9' ? '460px' : ratio === '1:1' ? '340px' : '280px', aspectRatio: ratio.replace(':','/') }}><Icons.ImageIcon className="text-slate-800" size={24}/></div>
                                ))
                            )}
                        </div>
                    </div>
                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-6">
                        <div className="flex justify-between items-center cursor-pointer" onClick={() => setIsStudioOpen(!isStudioOpen)}>
                            <div className="flex items-center gap-3"><div className="w-10 h-10 bg-yellow-500/10 rounded-full flex items-center justify-center text-yellow-400"><Icons.Mic size={20}/></div><h2 className="text-white font-bold">Voice Over Studio</h2></div>
                            <Icons.ChevronDown className={`transform transition-transform ${isStudioOpen ? 'rotate-180' : 'rotate-0'}`} />
                        </div>
                        {isStudioOpen && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6 animate-in">
                                <div className="space-y-3">
                                    <textarea value={voState.script} onChange={e => setVoState({...voState, script: e.target.value, audioUrl: null})} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-white h-32 resize-none outline-none" placeholder="Tulis naskah..."/>
                                    <div className="grid grid-cols-2 gap-2">
                                        <select className="bg-slate-950 border border-slate-800 text-xs rounded p-2 text-white outline-none" value={voState.voice} onChange={e=>setVoState({...voState, voice: e.target.value})}>{ttsVoices.map(v => (<option key={v.id} value={v.id}>{v.name}</option>))}</select>
                                        <button onClick={handleGenerateAudio} disabled={voState.loadingAudio} className="bg-yellow-600 text-white text-xs font-bold rounded flex items-center justify-center gap-2">{voState.loadingAudio ? <Icons.RefreshCw className="animate-spin" size={14}/> : <Icons.Volume2 size={14}/>} Audio</button>
                                    </div>
                                </div>
                                <div className="flex flex-col justify-center items-center bg-slate-950 border border-slate-800 rounded-lg p-6">
                                    {voState.audioUrl ? (
                                        <div className="space-y-4 w-full">
                                            <button onClick={toggleAudio} className="w-16 h-16 rounded-full bg-yellow-500 mx-auto flex items-center justify-center text-white">{voState.isPlaying ? <Icons.X size={24}/> : <Icons.Play size={24} fill="white" />}</button>
                                            <a href={voState.audioUrl} download="voiceover.wav" className="block w-full py-2 bg-slate-800 text-white text-xs font-bold rounded text-center">Download WAV</a>
                                        </div>
                                    ) : <p className="text-xs text-slate-600">Audio ready here</p>}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
              </main>
              <footer className="mt-12 border-t border-slate-800 py-6 text-center text-xs text-slate-500 font-mono">GREEN SAFIR | 2026</footer>
              {viewImageUrl && (
                  <div className="fixed inset-0 z-[60] bg-black/90 flex items-center justify-center p-4" onClick={() => setViewImageUrl(null)}>
                      <img src={viewImageUrl} className="max-h-[90vh] max-w-full rounded shadow-2xl"/>
                  </div>
              )}
              {showRecModal && (
                  <div className="fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                      <div className="bg-gray-800 border border-yellow-500 w-full max-w-lg rounded-xl p-6 shadow-2xl">
                          <h3 className="text-xl font-bold text-yellow-400 mb-4">Rekomendasi Pengisian</h3>
                          <p className="text-slate-300 mb-6">Biarkan AI menganalisis foto produk Anda untuk membuat deskripsi terbaik secara otomatis.</p>
                          <div className="flex justify-end gap-4">
                              <button onClick={() => setShowRecModal(false)} className="bg-gray-600 text-white py-2 px-6 rounded-full">Abaikan</button>
                              <button onClick={handleApplyRecommendation} className="bg-yellow-600 text-white py-2 px-6 rounded-full">Generate Deskripsi</button>
                          </div>
                      </div>
                  </div>
              )}
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
